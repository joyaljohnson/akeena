<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="Something special is waiting for you." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F2F8F4" />
    <title>You've got a letter 💌</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="You've got a letter 💌" />
    <meta property="og:description" content="Something special is waiting for you." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-envelope.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sealed envelope" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-envelope.jpg" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <style>
      /* The first screen is drawn here so it appears before any script has loaded. It mirrors the
         app's own PIN screen (src/envelope), which replaces it the moment the app starts. */
      #shell { display: flex; justify-content: center; min-height: 100dvh; background: #e4f0ea; }
      #shell[hidden] { display: none; }
      #shell .col { width: 100%; max-width: 430px; height: 100dvh; background: #f2f8f4; box-shadow: 0 0 60px rgba(34,51,45,.12); display: grid; place-items: center; overflow: hidden; }
      #shell .stack { display: grid; justify-items: center; gap: .9rem; padding: 0 1.25rem; }
      #shell h1 { margin: 0 0 1.4rem; font: 400 calc(2.5rem * 1.1)/1.3 'Parisienne', cursive; color: #22332d; text-align: center; }
      #shell .boxes { display: flex; gap: .6rem; min-height: 150px; align-items: flex-start; }
      #shell .boxes i { width: 48px; height: 58px; border: 1px solid #4f8f7a; border-radius: 10px; background: rgba(255,255,255,.7); opacity: .55; box-shadow: 0 2px 8px rgba(34,51,45,.08); }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="shell" aria-hidden="true" hidden>
        <div class="col">
          <div class="stack">
            <h1>A letter for you</h1>
            <div class="boxes"><i></i><i></i><i></i><i></i></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Only letter links get the envelope; the admin area and other pages start blank.
      if (/^#\/l\//.test(location.hash)) {
        document.getElementById('shell').hidden = false;
      }
    </script>
    <noscript>This letter needs JavaScript to open. Please enable it and try again.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
