<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="wax" gradientUnits="userSpaceOnUse" cx="70" cy="50" r="170">
      <stop offset="0" stop-color="#f3d3cb"/>
      <stop offset="0.5" stop-color="#dba9a0"/>
      <stop offset="1" stop-color="#bf8179"/>
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <!-- the wax: every part outlined first, then filled, so the outline follows the whole paw -->
  <g fill="none" stroke="#a8665f" stroke-width="7" stroke-linejoin="round" filter="url(#soft)"><ellipse cx="100" cy="124" rx="44" ry="34"/>
<circle cx="72" cy="140" r="23"/>
<circle cx="128" cy="140" r="23"/>
<ellipse cx="38" cy="94" rx="17" ry="24" transform="rotate(-28 38 94)"/>
<ellipse cx="72" cy="52" rx="18" ry="26" transform="rotate(-10 72 52)"/>
<ellipse cx="128" cy="52" rx="18" ry="26" transform="rotate(10 128 52)"/>
<ellipse cx="162" cy="94" rx="17" ry="24" transform="rotate(28 162 94)"/></g>
  <g fill="url(#wax)"><ellipse cx="100" cy="124" rx="44" ry="34"/>
<circle cx="72" cy="140" r="23"/>
<circle cx="128" cy="140" r="23"/>
<ellipse cx="38" cy="94" rx="17" ry="24" transform="rotate(-28 38 94)"/>
<ellipse cx="72" cy="52" rx="18" ry="26" transform="rotate(-10 72 52)"/>
<ellipse cx="128" cy="52" rx="18" ry="26" transform="rotate(10 128 52)"/>
<ellipse cx="162" cy="94" rx="17" ry="24" transform="rotate(28 162 94)"/></g>
  <!-- soft light on the top-left of each part, so the wax looks raised -->
  <g fill="#fff6f2" fill-opacity="0.55" filter="url(#soft)">
    <ellipse cx="88" cy="108" rx="22" ry="10" transform="rotate(-8 88 108)"/>
    <ellipse cx="32" cy="84" rx="5" ry="11" transform="rotate(-28 32 84)"/>
    <ellipse cx="66" cy="40" rx="5.5" ry="12" transform="rotate(-10 66 40)"/>
    <ellipse cx="122" cy="40" rx="5.5" ry="12" transform="rotate(10 122 40)"/>
    <ellipse cx="156" cy="84" rx="5" ry="11" transform="rotate(28 156 84)"/>
  </g>
</svg>
