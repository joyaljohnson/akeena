name: Keep Supabase awake
# Free Supabase projects pause after about a week without activity, which would break every link.
# This pings a harmless, read-only function twice a week.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call check_link with a dummy token
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e
          test -n "$URL" && test -n "$KEY" || { echo "Supabase secrets not set yet; skipping."; exit 0; }
          curl --fail --silent --show-error \
            -X POST "$URL/rest/v1/rpc/check_link" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}'
